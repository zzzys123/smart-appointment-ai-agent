name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Offline unit + integration tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q agents api config db evaluation scripts services tests app.py

      - name: Run the complete deterministic suite
        run: python -m pytest -q

      - name: Show tests reserved for explicit online runs
        run: python -m pytest --collect-only -q -m online

  java:
    name: Spring Boot tests with MySQL Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Run unit and real MySQL integration tests
        run: mvn -B test

  quality-gates:
    name: Golden v2 + knowledge baseline integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen Golden v2 files
        run: python evaluation/verify_golden_v2.py

      - name: Verify frozen Golden v2 baseline results
        run: python evaluation/verify_golden_v2_baseline.py

      - name: Verify versioned knowledge sources and 80 chunks
        run: python scripts/manage_knowledge.py verify-manifest

  frontend:
    name: Frontend production build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Docker image and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - java
      - quality-gates
      - frontend
      - secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smart-appointment-ai-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Java appointment image
        uses: docker/build-push-action@v6
        with:
          context: backend-java
          push: false
          tags: smart-appointment-service:ci
          cache-from: type=gha,scope=appointment-service
          cache-to: type=gha,mode=max,scope=appointment-service
